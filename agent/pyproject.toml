[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "translog-assistant"
version = "0.1.0"
description = "MVP acadêmico TransLog: rastreio, FAQ e políticas com ADK e Chroma"
requires-python = ">=3.12,<3.14"
dependencies = ["google-adk==2.14.1", "chromadb==1.5.9", "python-dotenv==1.2.4", "msvc-runtime==14.51.36231; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1"]

[project.scripts]
translog = "translog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
