<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransLog · Rastreamento de pedidos (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          primary: { DEFAULT: '#0F4C81', 50: '#EEF4FA', 100: '#D7E5F2', 200: '#AFCAE4', 700: '#0C3E6A', 800: '#0A3256' },
          accent: { DEFAULT: '#F59E0B' }
        }
      }
    }
  };
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  html, body { height: 100%; }
  body { font-feature-settings: 'cv11', 'ss01'; }
  .tabular { font-variant-numeric: tabular-nums; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
  .scroll-thin::-webkit-scrollbar { width: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  .typing { display: inline-flex; gap: 3px; }
  .typing span { width: 6px; height: 6px; border-radius: 9999px; background: #94A3B8; animation: typing 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="flex flex-col min-w-[1280px] bg-slate-50 text-slate-900 antialiased overflow-hidden">

  <!-- ============ BARRA DE CONTROLE DO PROTÓTIPO (não faz parte do produto) ============ -->
  <div id="protoBar" class="shrink-0 bg-slate-900 text-[11px] text-slate-400 border-b border-slate-800">
    <div class="flex items-center gap-3 px-4 h-9">
      <span class="flex items-center gap-1.5 font-semibold uppercase tracking-wider text-slate-500">
        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>Protótipo
      </span>
      <div id="protoGroups" class="flex items-center gap-3"></div>
      <button id="protoHide" class="ml-auto flex items-center gap-1 px-2 h-6 rounded text-slate-500 hover:text-white hover:bg-white/5">
        <i data-lucide="eye-off" class="w-3.5 h-3.5"></i>Ocultar
      </button>
    </div>
  </div>
  <button id="protoShow" class="hidden fixed bottom-3 left-3 z-50 items-center gap-1.5 px-3 h-7 rounded-full bg-slate-900/90 text-[11px] font-medium text-slate-300 shadow-lg hover:text-white">
    <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>Controles do protótipo
  </button>

  <!-- ============ CABEÇALHO ============ -->
  <header class="shrink-0 bg-white border-b border-slate-200">
    <div class="mx-auto max-w-[1440px] px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary text-white grid place-items-center shadow-sm">
          <i data-lucide="package" class="w-5 h-5"></i>
        </div>
        <div class="leading-tight">
          <div class="text-[15px] font-semibold tracking-tight">TransLog</div>
          <div class="text-xs text-slate-500">Rastreamento de pedidos</div>
        </div>
      </div>
      <div id="conn"></div>
    </div>
  </header>

  <!-- ============ ÁREA PRINCIPAL ============ -->
  <main class="flex-1 min-h-0">
    <div class="mx-auto max-w-[1440px] h-full px-6 py-6 grid grid-cols-[minmax(0,1fr)_400px] grid-rows-[minmax(0,1fr)] gap-6">

      <!-- Coluna de rastreio -->
      <section class="min-h-0 overflow-y-auto scroll-thin -mr-2 pr-2 pb-2 space-y-4">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
          <form id="searchForm" class="flex items-end gap-3" novalidate>
            <div class="flex-1">
              <label for="orderInput" class="block text-sm font-medium text-slate-700 mb-1.5">Número do pedido</label>
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                <input id="orderInput" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="Ex.: 375"
                  class="w-full h-10 rounded-md border border-slate-300 bg-white pl-9 pr-3 text-sm tabular placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition">
              </div>
            </div>
            <button type="submit" id="searchBtn"
              class="h-10 px-5 rounded-md bg-primary text-white text-sm font-medium shadow-sm hover:bg-primary-700 inline-flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed transition">
              Rastrear
            </button>
          </form>
          <p id="searchHint" class="hidden mt-2 text-xs text-red-600">Informe o número do pedido.</p>
          <div class="mt-4 flex items-center gap-2">
            <span class="text-xs text-slate-500 mr-1">Exemplos:</span>
            <div id="examples" class="flex items-center gap-2"></div>
          </div>
        </div>

        <div id="trackResult" class="space-y-4"></div>
      </section>

      <!-- Painel do chat -->
      <aside class="min-h-0 flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="shrink-0 px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-primary-50 text-primary grid place-items-center">
              <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <div class="leading-tight">
              <h2 class="text-sm font-semibold">Assistente TransLog</h2>
              <p class="text-xs text-slate-500 mt-0.5">Pergunte sobre sua entrega</p>
            </div>
          </div>
          <button id="newChat" class="h-8 px-2.5 rounded-md border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 inline-flex items-center gap-1.5 transition">
            <i data-lucide="square-pen" class="w-3.5 h-3.5"></i>Nova conversa
          </button>
        </div>
        <div id="chatContext" class="shrink-0"></div>
        <div id="chatMessages" class="flex-1 min-h-0 overflow-y-auto scroll-thin px-5 py-4"></div>
        <div class="shrink-0 border-t border-slate-200 p-3">
          <form id="chatForm" class="flex items-end gap-2 rounded-lg border border-slate-300 bg-white p-1.5 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition">
            <textarea id="chatInput" rows="1" placeholder="Escreva sua pergunta…"
              class="flex-1 resize-none bg-transparent px-2 py-1.5 text-sm leading-5 placeholder:text-slate-400 focus:outline-none max-h-32 scroll-thin"></textarea>
            <button type="submit" id="chatSend" aria-label="Enviar"
              class="w-8 h-8 shrink-0 rounded-md bg-primary text-white grid place-items-center hover:bg-primary-700 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed transition">
              <i data-lucide="send-horizontal" class="w-4 h-4"></i>
            </button>
          </form>
          <p class="mt-1.5 px-1 text-[11px] text-slate-400">Enter para enviar · Shift+Enter para quebrar linha</p>
        </div>
      </aside>
    </div>
  </main>

<script>
/* =====================================================================
   DADOS DE EXEMPLO (valores exatamente como vêm da base)
   ===================================================================== */
const ORDERS = [
 {"orderId":15,"orderDate":"2015-01-01","shippingMode":"Standard Class","trackingStatus":"Entregue","deadlineStatus":"Atrasado","delayDays":2,"delayWindow":"Atraso Leve (1 a 2 dias)","estimatedDeliveryDate":"2015-01-05","actualDeliveryDate":"2015-01-07","origin":"Memphis, Tennessee, Estados Unidos","destination":"Brasília, Distrito Federal, Brasil","region":"América do Sul","market":"LATAM","items":[{"productName":"Nike Men's Dri-FIT Victory Golf Polo","category":"Women's Apparel","quantity":1,"total":37.5},{"productName":"Pelican Sunstream 100 Kayak","category":"Water Sports","quantity":1,"total":163.99},{"productName":"Bridgestone e6 Straight Distance NFL San Dieg","category":"Electronics","quantity":3,"total":89.25},{"productName":"Perfect Fitness Perfect Rip Deck","category":"Cleats","quantity":3,"total":151.17},{"productName":"Field & Stream Sportsman 16 Gun Fire Safe","category":"Fishing","quantity":1,"total":331.98}],"total":773.89,"probableCause":null},
 {"orderId":375,"orderDate":"2015-01-06","shippingMode":"Second Class","trackingStatus":"Em Trânsito","deadlineStatus":"Atrasado","delayDays":4,"delayWindow":"Atraso Crítico (3+ dias)","estimatedDeliveryDate":"2015-01-08","actualDeliveryDate":null,"origin":"San Benito, Texas, Estados Unidos","destination":"Saltillo, Coahuila, México","region":"América Central","market":"LATAM","items":[{"productName":"adidas Youth Germany Black/Red Away Match Soc","category":"Girls' Apparel","quantity":1,"total":68.6},{"productName":"Under Armour Men's Tech II T-Shirt","category":"Lacrosse","quantity":1,"total":22.74}],"total":91.34,"probableCause":"Promessa irreal"},
 {"orderId":562,"orderDate":"2015-01-09","shippingMode":"Standard Class","trackingStatus":"Aguardando Liberação","deadlineStatus":"Não Avaliado","delayDays":null,"delayWindow":"Não Avaliado (Aguardando Liberação)","estimatedDeliveryDate":"2015-01-13","actualDeliveryDate":null,"origin":"Dallas, Texas, Estados Unidos","destination":"Belo Horizonte, Minas Gerais, Brasil","region":"América do Sul","market":"LATAM","items":[{"productName":"Nike Men's CJ Elite 2 TD Football Cleat","category":"Men's Footwear","quantity":1,"total":109.19},{"productName":"Nike Men's Dri-FIT Victory Golf Polo","category":"Women's Apparel","quantity":3,"total":144.0},{"productName":"Field & Stream Sportsman 16 Gun Fire Safe","category":"Fishing","quantity":1,"total":387.98}],"total":641.17,"probableCause":null},
 {"orderId":1002,"orderDate":"2015-01-15","shippingMode":"Second Class","trackingStatus":"Cancelado","deadlineStatus":"Cancelado","delayDays":null,"delayWindow":"Envios Cancelados","estimatedDeliveryDate":"2015-01-17","actualDeliveryDate":null,"origin":"Lynwood, Califórnia, Estados Unidos","destination":"San Lorenzo, Central, Paraguai","region":"América do Sul","market":"LATAM","items":[{"productName":"Diamondback Women's Serene Classic Comfort Bi","category":"Camping & Hiking","quantity":1,"total":287.98},{"productName":"Pelican Sunstream 100 Kayak","category":"Water Sports","quantity":1,"total":189.99},{"productName":"Nike Men's Dri-FIT Victory Golf Polo","category":"Women's Apparel","quantity":5,"total":200.0},{"productName":"Under Armour Girls' Toddler Spine Surge Runni","category":"Shop By Sport","quantity":5,"total":173.96}],"total":851.93,"probableCause":null}
];
const EXAMPLES = [15, 375, 562, 1002];

// Explicação usada na resposta pronta do assistente
const CAUSE_DETAIL = {
  375: 'o prazo de 2 dias da modalidade Second Class foi curto para a rota Texas → Saltillo (México).'
};

/* =====================================================================
   ESTADO
   ===================================================================== */
const state = {
  connected: true,
  tracker: { view: 'empty', orderId: null, query: '' }, // empty | loading | result | notfound | error
  chat: { messages: [], typing: false }
};
let trackToken = 0;
let chatToken = 0;
let msgSeq = 0;

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);
const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD' });
const fmtMoney = (v) => money.format(v);
const fmtDate = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const nowTime = (offsetMin = 0) => new Date(Date.now() - offsetMin * 60000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const richText = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold">$1</strong>').replace(/\n/g, '<br>');
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const findOrder = (id) => ORDERS.find((o) => o.orderId === Number(id)) || null;
const currentOrder = () => (state.tracker.view === 'result' ? findOrder(state.tracker.orderId) : null);
const splitPlace = (s) => { const p = s.split(', '); return { city: p[0], rest: p.slice(1).join(', ') }; };
const icons = () => { if (window.lucide) window.lucide.createIcons(); };

function delayLabel(d) {
  if (d == null) return null;
  if (d > 0) return plural(d, 'dia', 'dias') + ' de atraso';
  if (d < 0) return plural(-d, 'dia', 'dias') + ' adiantado';
  return 'no prazo';
}

/* =====================================================================
   BADGES
   ===================================================================== */
const STATUS_STYLE = {
  'Entregue':             { cls: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
  'Em Trânsito':          { cls: 'bg-primary-50 text-primary border-primary-200',     dot: 'bg-primary' },
  'Aguardando Liberação': { cls: 'bg-amber-50 text-amber-800 border-amber-200',       dot: 'bg-amber-500' },
  'Cancelado':            { cls: 'bg-slate-100 text-slate-600 border-slate-200',      dot: 'bg-slate-400' }
};
const DEADLINE_STYLE = {
  'Atrasado':  { cls: 'bg-red-50 text-red-700 border-red-200',              icon: 'clock' },
  'No Prazo':  { cls: 'bg-transparent text-emerald-700 border-emerald-500', icon: 'circle-check' },
  'Adiantado': { cls: 'bg-transparent text-emerald-700 border-emerald-500', icon: 'circle-check' }
};
const BADGE = 'inline-flex items-center gap-1.5 rounded-md border px-2 py-0.5 text-xs font-medium whitespace-nowrap';

function statusBadge(v) {
  const s = STATUS_STYLE[v] || STATUS_STYLE['Cancelado'];
  return `<span class="${BADGE} ${s.cls}"><span class="w-1.5 h-1.5 rounded-full ${s.dot}"></span>${v}</span>`;
}
function deadlineBadge(v) {
  if (v === 'Não Avaliado' || v === 'Cancelado' || !DEADLINE_STYLE[v]) return '';
  const s = DEADLINE_STYLE[v];
  return `<span class="${BADGE} ${s.cls}"><i data-lucide="${s.icon}" class="w-3 h-3"></i>${v}</span>`;
}

/* =====================================================================
   CABEÇALHO: CONEXÃO
   ===================================================================== */
function renderConn() {
  $('#conn').innerHTML = state.connected
    ? `<div class="flex items-center gap-2 rounded-full border border-slate-200 px-2.5 py-1 text-xs text-slate-600"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Conectado</div>`
    : `<div class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-500"><span class="w-2 h-2 rounded-full bg-slate-400"></span>Sem conexão</div>`;
}

/* =====================================================================
   COLUNA DE RASTREIO
   ===================================================================== */
const CARD = 'bg-white border border-slate-200 rounded-xl shadow-sm';

function renderExamples() {
  const active = state.tracker.view === 'result' ? state.tracker.orderId : null;
  $('#examples').innerHTML = EXAMPLES.map((id) => {
    const on = id === active;
    return `<button type="button" data-example="${id}" class="h-7 px-3 rounded-full border text-xs font-medium tabular transition ${on
      ? 'border-primary bg-primary text-white'
      : 'border-slate-200 bg-slate-50 text-slate-700 hover:border-primary-200 hover:bg-primary-50 hover:text-primary'}">#${id}</button>`;
  }).join('');
}

function viewEmpty() {
  return `<div class="${CARD} border-dashed shadow-none py-14 px-8 text-center fade-in">
    <div class="mx-auto w-12 h-12 rounded-full bg-primary-50 text-primary grid place-items-center"><i data-lucide="package-search" class="w-6 h-6"></i></div>
    <h2 class="mt-4 text-base font-semibold">Acompanhe seu pedido</h2>
    <p class="mt-1.5 text-sm text-slate-500 max-w-md mx-auto">Digite o número do pedido acima ou escolha um dos exemplos. Você verá a situação, o prazo de entrega e, se houver atraso, o motivo provável.</p>
  </div>`;
}

function viewLoading() {
  const bar = (w, h = 'h-4') => `<div class="${h} ${w} rounded bg-slate-200"></div>`;
  const step = `<div class="flex flex-col items-center gap-3"><div class="w-10 h-10 rounded-full bg-slate-200"></div>${bar('w-24', 'h-3')}${bar('w-16', 'h-2.5')}</div>`;
  return `<div class="${CARD} animate-pulse" aria-busy="true" aria-label="Carregando pedido">
      <div class="p-6">
        <div class="flex items-center gap-3">${bar('w-36', 'h-6')}${bar('w-24', 'h-5')}${bar('w-20', 'h-5')}</div>
        ${bar('w-40 mt-2', 'h-3')}
        <div class="mt-5 h-[84px] rounded-lg bg-slate-100"></div>
      </div>
      <div class="border-t border-slate-100 p-6">${bar('w-24 mb-6', 'h-3')}<div class="grid grid-cols-4">${step.repeat(4)}</div></div>
    </div>
    <div class="${CARD} p-6 animate-pulse">
      ${bar('w-16 mb-5', 'h-3')}
      <div class="grid grid-cols-[1fr_auto_1fr] gap-4 items-center"><div class="h-20 rounded-lg bg-slate-100"></div><div class="w-6 h-6 rounded-full bg-slate-200"></div><div class="h-20 rounded-lg bg-slate-100"></div></div>
    </div>
    <div class="${CARD} p-6 animate-pulse space-y-3">${bar('w-16 mb-2', 'h-3')}${bar('w-full')}${bar('w-full')}${bar('w-2/3')}</div>`;
}

function viewNotFound() {
  return `<div class="${CARD} py-14 px-8 text-center fade-in">
    <div class="mx-auto w-12 h-12 rounded-full bg-slate-100 text-slate-500 grid place-items-center"><i data-lucide="search-x" class="w-6 h-6"></i></div>
    <h2 class="mt-4 text-base font-semibold">Pedido não encontrado.</h2>
    <p class="mt-1.5 text-sm text-slate-500">Confira o número e tente novamente.</p>
    ${state.tracker.query ? `<p class="mt-3 inline-flex items-center rounded-md bg-slate-100 px-2 py-0.5 text-xs text-slate-500 tabular">Número buscado: ${escapeHtml(state.tracker.query)}</p>` : ''}
  </div>`;
}

function viewError() {
  return `<div class="${CARD} py-14 px-8 text-center fade-in">
    <div class="mx-auto w-12 h-12 rounded-full bg-red-50 text-red-600 grid place-items-center"><i data-lucide="wifi-off" class="w-6 h-6"></i></div>
    <h2 class="mt-4 text-base font-semibold">Não foi possível conectar ao sistema</h2>
    <p class="mt-1.5 text-sm text-slate-500">Verifique sua conexão e tente novamente em alguns instantes.</p>
    <button type="button" id="retryTrack" class="mt-5 h-9 px-4 rounded-md border border-slate-300 bg-white text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 inline-flex items-center gap-2 transition">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>Tentar novamente
    </button>
  </div>`;
}

/* ---------- Resultado ---------- */
function highlight(o) {
  const s = o.trackingStatus;
  let icon, iconCls, title, sub = '';
  const delay = delayLabel(o.delayDays);
  const subLine = (txt, tone) => `<p class="mt-0.5 text-sm font-medium ${tone}">${txt}${o.deadlineStatus === 'Atrasado' && o.delayWindow ? `<span class="text-slate-300 mx-1.5">·</span><span class="font-normal text-slate-500">${o.delayWindow}</span>` : ''}</p>`;

  if (s === 'Entregue') {
    icon = 'package-check'; iconCls = 'bg-emerald-100 text-emerald-700';
    title = `Entregue em ${fmtDate(o.actualDeliveryDate)}`;
    if (delay) sub = subLine(delay, o.delayDays > 0 ? 'text-red-600' : 'text-emerald-700');
  } else if (s === 'Em Trânsito') {
    icon = 'truck'; iconCls = 'bg-primary-100 text-primary';
    title = `Previsto para ${fmtDate(o.estimatedDeliveryDate)}`;
    if (o.delayDays > 0) sub = subLine(delay, 'text-red-600');
  } else if (s === 'Aguardando Liberação') {
    icon = 'clock'; iconCls = 'bg-amber-100 text-amber-700';
    title = 'Aguardando liberação do pedido';
    sub = `<p class="mt-0.5 text-sm text-slate-500">Entrega prevista para <span class="font-medium text-slate-700 tabular">${fmtDate(o.estimatedDeliveryDate)}</span></p>`;
  } else {
    icon = 'ban'; iconCls = 'bg-slate-200 text-slate-600';
    title = 'Pedido cancelado';
  }

  return `<div class="mt-5 flex items-center gap-4 rounded-lg border border-slate-200 bg-slate-50/70 p-4">
    <div class="w-12 h-12 shrink-0 rounded-full grid place-items-center ${iconCls}"><i data-lucide="${icon}" class="w-6 h-6"></i></div>
    <div><p class="text-xl font-semibold tracking-tight tabular">${title}</p>${sub}</div>
  </div>`;
}

function causeAlert(o) {
  if (!o.probableCause) return '';
  return `<div class="mt-4 flex items-center gap-4 rounded-lg border border-amber-300 bg-amber-50 p-4 border-l-4 border-l-accent">
    <div class="w-10 h-10 shrink-0 rounded-md bg-accent text-white grid place-items-center shadow-sm"><i data-lucide="triangle-alert" class="w-5 h-5"></i></div>
    <div class="flex-1 min-w-0">
      <p class="text-xs font-semibold uppercase tracking-wide text-amber-800">Motivo provável do atraso</p>
      <p class="mt-0.5 text-lg font-semibold text-slate-900">${o.probableCause}</p>
      <p class="text-sm text-amber-900/75">Quer entender melhor? O assistente explica o que aconteceu.</p>
    </div>
    <button type="button" data-ask="Por que meu pedido atrasou?" class="shrink-0 h-9 px-3 rounded-md border border-amber-300 bg-white text-sm font-medium text-amber-900 hover:bg-amber-100 inline-flex items-center gap-2 transition">
      <i data-lucide="message-circle" class="w-4 h-4"></i>Perguntar ao assistente
    </button>
  </div>`;
}

const TIMELINE = {
  'Entregue':             ['done', 'done', 'done', 'done'],
  'Em Trânsito':          ['done', 'done', 'current', 'pending'],
  'Aguardando Liberação': ['done', 'current', 'pending', 'pending']
};
const STEPS = [
  { label: 'Pedido realizado', icon: 'shopping-cart' },
  { label: 'Pedido liberado',  icon: 'clipboard-check' },
  { label: 'Em trânsito',      icon: 'truck' },
  { label: 'Entregue',         icon: 'package-check' }
];
const CIRCLE = {
  done:    'bg-primary border-primary text-white',
  current: 'bg-white border-primary text-primary ring-4 ring-primary/10',
  pending: 'bg-white border-slate-200 text-slate-300'
};

function stepNode(step, k) {
  return `<div class="relative z-10 w-10 h-10 rounded-full border-2 grid place-items-center ${CIRCLE[k]}">
    <i data-lucide="${k === 'done' ? 'check' : step.icon}" class="w-[18px] h-[18px]"></i></div>`;
}

function timeline(o) {
  const head = `<h3 class="text-sm font-semibold text-slate-900 mb-6">Andamento</h3>`;

  if (o.trackingStatus === 'Cancelado') {
    return `${head}<div class="flex items-center gap-6">
      <div class="w-40 flex flex-col items-center text-center">
        ${stepNode(STEPS[0], 'done')}
        <p class="mt-3 text-sm font-medium">${STEPS[0].label}</p>
        <p class="mt-0.5 text-xs text-slate-500 tabular">${fmtDate(o.orderDate)}</p>
      </div>
      <div class="flex-1 flex items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 p-4">
        <i data-lucide="circle-x" class="w-5 h-5 text-slate-500 shrink-0 mt-0.5"></i>
        <div>
          <p class="text-sm font-medium text-slate-900">Este pedido foi cancelado.</p>
          <p class="text-sm text-slate-500 mt-0.5">Ele não será liberado nem enviado. Se tiver dúvidas, fale com o assistente.</p>
        </div>
      </div>
    </div>`;
  }

  const st = TIMELINE[o.trackingStatus];
  const items = STEPS.map((step, i) => {
    const k = st[i];
    const next = st[i + 1];
    const line = i < 3
      ? `<div class="absolute top-[19px] left-1/2 w-full h-0.5 ${next && next !== 'pending' ? 'bg-primary' : 'bg-slate-200'}"></div>` : '';
    let sub = '';
    if (i === 0) sub = `<span class="tabular">${fmtDate(o.orderDate)}</span>`;
    else if (i === 3) sub = k === 'done'
      ? `<span class="tabular">${fmtDate(o.actualDeliveryDate)}</span>`
      : `previsto para <span class="tabular">${fmtDate(o.estimatedDeliveryDate)}</span>`;
    else if (k === 'current') sub = `<span class="font-medium text-primary">Etapa atual</span>`;

    return `<li class="relative flex flex-col items-center text-center px-2">
      ${line}${stepNode(step, k)}
      <p class="mt-3 text-sm font-medium ${k === 'pending' ? 'text-slate-400' : 'text-slate-900'}">${step.label}</p>
      <p class="mt-0.5 text-xs text-slate-500 min-h-[16px]">${sub}</p>
    </li>`;
  }).join('');
  return `${head}<ol class="grid grid-cols-4">${items}</ol>`;
}

function routeCard(o) {
  const a = splitPlace(o.origin), b = splitPlace(o.destination);
  const place = (label, icon, p) => `<div class="rounded-lg border border-slate-200 p-4">
    <p class="flex items-center gap-1.5 text-xs font-medium text-slate-500"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p>
    <p class="mt-1.5 font-semibold text-slate-900">${p.city}</p>
    <p class="text-sm text-slate-500">${p.rest}</p>
  </div>`;
  const meta = (label, value) => `<div><dt class="text-xs text-slate-500">${label}</dt><dd class="mt-0.5 text-sm font-medium text-slate-900">${value}</dd></div>`;
  return `<section class="${CARD} p-6">
    <h3 class="text-sm font-semibold text-slate-900 mb-4">Rota</h3>
    <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
      ${place('Origem', 'warehouse', a)}
      <div class="w-8 h-8 rounded-full border border-slate-200 bg-slate-50 text-slate-500 grid place-items-center"><i data-lucide="arrow-right" class="w-4 h-4"></i></div>
      ${place('Destino', 'map-pin', b)}
    </div>
    <dl class="mt-5 pt-4 border-t border-slate-100 grid grid-cols-3 gap-4">
      ${meta('Região', o.region)}${meta('Mercado', o.market)}${meta('Modalidade de envio', o.shippingMode)}
    </dl>
  </section>`;
}

function itemsCard(o) {
  const rows = o.items.map((it) => `<tr>
      <td class="px-6 py-3 font-medium text-slate-900">${escapeHtml(it.productName)}</td>
      <td class="px-3 py-3"><span class="inline-flex rounded-md border border-slate-200 px-2 py-0.5 text-xs text-slate-600 whitespace-nowrap">${escapeHtml(it.category)}</span></td>
      <td class="px-3 py-3 text-right tabular text-slate-700">${it.quantity}</td>
      <td class="px-6 py-3 text-right tabular text-slate-900 whitespace-nowrap">${fmtMoney(it.total)}</td>
    </tr>`).join('');
  return `<section class="${CARD} overflow-hidden">
    <div class="px-6 pt-5 pb-3 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-900">Itens</h3>
      <span class="text-xs text-slate-500">${plural(o.items.length, 'item', 'itens')}</span>
    </div>
    <table class="w-full text-sm">
      <thead>
        <tr class="border-y border-slate-200 bg-slate-50 text-xs text-slate-500">
          <th class="px-6 py-2.5 text-left font-medium">Produto</th>
          <th class="px-3 py-2.5 text-left font-medium">Categoria</th>
          <th class="px-3 py-2.5 text-right font-medium">Quantidade</th>
          <th class="px-6 py-2.5 text-right font-medium">Valor</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">${rows}</tbody>
      <tfoot>
        <tr class="border-t border-slate-200 bg-slate-50/60">
          <td colspan="3" class="px-6 py-3.5 text-right text-sm font-medium text-slate-600">Total do pedido</td>
          <td class="px-6 py-3.5 text-right text-base font-semibold tabular whitespace-nowrap">${fmtMoney(o.total)}</td>
        </tr>
      </tfoot>
    </table>
  </section>`;
}

function viewResult(o) {
  return `<article class="${CARD} fade-in">
      <div class="p-6">
        <div class="flex items-center gap-2.5 flex-wrap">
          <h2 class="text-2xl font-semibold tracking-tight mr-1 tabular">Pedido #${o.orderId}</h2>
          ${statusBadge(o.trackingStatus)}${deadlineBadge(o.deadlineStatus)}
        </div>
        <p class="mt-1 flex items-center gap-1.5 text-sm text-slate-500">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>Realizado em <span class="tabular">${fmtDate(o.orderDate)}</span>
          <span class="text-slate-300 mx-1">·</span>${o.shippingMode}
        </p>
        ${highlight(o)}
        ${causeAlert(o)}
      </div>

    </article>
    <div class="fade-in">${routeCard(o)}</div>

}

function renderTracker() {
  const t = state.tracker;
  const el = $('#trackResult');
  if (t.view === 'loading') el.innerHTML = viewLoading();
  else if (t.view === 'result') el.innerHTML = viewResult(findOrder(t.orderId));
  else if (t.view === 'notfound') el.innerHTML = viewNotFound();
  else if (t.view === 'error') el.innerHTML = viewError();
  else el.innerHTML = viewEmpty();
  $('#searchBtn').disabled = t.view === 'loading';
  renderExamples();
}

function track(raw) {
  const q = String(raw || '').replace(/\D/g, '');
  $('#orderInput').value = q;
  if (!q) { $('#searchHint').classList.remove('hidden'); $('#orderInput').focus(); return; }
  $('#searchHint').classList.add('hidden');
  state.tracker = { view: 'loading', orderId: null, query: q };
  renderAll();
  const tok = ++trackToken;
  setTimeout(() => {
    if (tok !== trackToken) return;
    if (!state.connected) state.tracker.view = 'error';
    else {
      const o = findOrder(q);
      state.tracker = o ? { view: 'result', orderId: o.orderId, query: q } : { view: 'notfound', orderId: null, query: q };
    }
    renderAll();
  }, 900);
}

function openOrderNow(id) {
  trackToken++;
  $('#orderInput').value = String(id);
  $('#searchHint').classList.add('hidden');
  state.tracker = { view: 'result', orderId: id, query: String(id) };
}

/* =====================================================================
   CHAT
   ===================================================================== */
const SUGGESTIONS = ['Quando meu pedido chega?', 'Por que meu pedido atrasou?', 'Quais são as modalidades de envio?'];

const MODES_REPLY = 'Trabalhamos com quatro modalidades de envio:\n' +
  '• **Standard Class**: a opção econômica, com prazo de entrega de 4 dias.\n' +
  '• **Second Class**: um pouco mais rápida, com prazo de 2 dias.\n' +
  '• **First Class**: envio prioritário, com prazo de 1 dia.\n' +
  '• **Same Day**: o pedido é despachado no mesmo dia.';
const ASK_NUMBER = 'Para consultar, me informe o número do pedido.';
const FALLBACK = 'Posso ajudar com a situação, o prazo e o motivo de atraso de um pedido, ou explicar as modalidades de envio. O que você gostaria de saber?';

function whenReply(o) {
  const id = o.orderId, d = o.delayDays;
  switch (o.trackingStatus) {
    case 'Em Trânsito':
      return d > 0
        ? `O pedido ${id} está **Em Trânsito**. A entrega estava prevista para ${fmtDate(o.estimatedDeliveryDate)} e está ${plural(d, 'dia', 'dias')} atrasada.`
        : `O pedido ${id} está **Em Trânsito**, com entrega prevista para ${fmtDate(o.estimatedDeliveryDate)}.`;
    case 'Entregue':
      if (d > 0) return `O pedido ${id} foi **Entregue** em ${fmtDate(o.actualDeliveryDate)}, ${plural(d, 'dia', 'dias')} depois da data prevista (${fmtDate(o.estimatedDeliveryDate)}).`;
      if (d < 0) return `O pedido ${id} foi **Entregue** em ${fmtDate(o.actualDeliveryDate)}, ${plural(-d, 'dia', 'dias')} antes da data prevista.`;
      return `O pedido ${id} foi **Entregue** em ${fmtDate(o.actualDeliveryDate)}, dentro do prazo.`;
    case 'Aguardando Liberação':
      return `O pedido ${id} está **Aguardando Liberação**. Depois de liberado, a entrega está prevista para ${fmtDate(o.estimatedDeliveryDate)}.`;
    default:
      return `O pedido ${id} foi **Cancelado** e não será entregue.`;
  }
}

function whyReply(o) {
  const id = o.orderId;
  if (o.probableCause) {
    return CAUSE_DETAIL[id]
      ? `O motivo provável do atraso do pedido ${id} é **${o.probableCause}**: ${CAUSE_DETAIL[id]}`
      : `O motivo provável do atraso do pedido ${id} é **${o.probableCause}**.`;
  }
  if (o.trackingStatus === 'Cancelado') return `O pedido ${id} foi **Cancelado**, então não há atraso a analisar.`;
  if (o.trackingStatus === 'Aguardando Liberação') return `O pedido ${id} não está atrasado. Ele está **Aguardando Liberação** e a entrega está prevista para ${fmtDate(o.estimatedDeliveryDate)}.`;
  if (o.delayDays > 0) {
    const verb = o.trackingStatus === 'Entregue' ? 'foi entregue' : 'está';
    return `O pedido ${id} ${verb} com ${plural(o.delayDays, 'dia', 'dias')} de atraso, mas ainda não há um motivo provável registrado para ele.`;
  }
  return `O pedido ${id} não está atrasado. ${whenReply(o)}`;
}

function buildReply(text) {
  const t = norm(text);
  let o = currentOrder();

  // Número de pedido citado na mensagem
  const num = t.match(/\d+/);
  let mentioned = false;
  if (num) {
    const found = findOrder(num[0]);
    if (found) {
      mentioned = true;
      if (!o || o.orderId !== found.orderId) { openOrderNow(found.orderId); o = found; }
    } else if (/pedido/.test(t) || /^\s*\d+\s*$/.test(t)) {
      return `Não encontrei o pedido ${num[0]}. Confira o número e tente novamente.`;
    }
  }

  if (/modalidade|tipos de envio|formas de envio|classe/.test(t)) return MODES_REPLY;
  const asksWhy = /atras|por que|porque|motivo|demor/.test(t);
  const asksWhen = /quando|chega|prazo|previs|entreg|situac|status|onde/.test(t);
  if (asksWhy || asksWhen || mentioned || /pedido/.test(t)) {
    if (!o) return ASK_NUMBER;
    return asksWhy ? whyReply(o) : whenReply(o);
  }
  return FALLBACK;
}

function renderChatContext() {
  const o = currentOrder();
  $('#chatContext').innerHTML = o
    ? `<div class="px-5 py-2.5 border-b border-slate-100 bg-slate-50/70">
        <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-2.5 py-1 text-xs text-slate-600">
          <i data-lucide="package" class="w-3.5 h-3.5 text-primary"></i>Falando sobre o pedido <span class="font-semibold text-slate-900 tabular">${o.orderId}</span>
        </span>
      </div>` : '';
}

const avatar = `<div class="w-7 h-7 shrink-0 rounded-full bg-primary-50 text-primary grid place-items-center"><i data-lucide="bot" class="w-4 h-4"></i></div>`;

function msgHtml(m) {
  if (m.role === 'user') {
    const failed = m.status === 'failed';
    return `<div class="flex justify-end fade-in"><div class="max-w-[85%] flex flex-col items-end">
      <div class="rounded-2xl rounded-br-md px-3.5 py-2 text-sm leading-relaxed whitespace-pre-wrap break-words ${failed ? 'bg-primary/60 text-white' : 'bg-primary text-white'}">${escapeHtml(m.text)}</div>
      ${failed
        ? `<span class="mt-1 flex items-center gap-1 text-[11px] text-red-600"><i data-lucide="circle-alert" class="w-3 h-3"></i>Não enviada<span class="text-red-300">·</span><button type="button" data-retry="${m.id}" class="font-medium hover:underline underline-offset-2">Tentar novamente</button></span>`
        : `<span class="mt-1 text-[11px] text-slate-400 tabular">${m.time}</span>`}
    </div></div>`;
  }
  return `<div class="flex gap-2.5 fade-in">${avatar}<div class="max-w-[85%]">
    <div class="rounded-2xl rounded-tl-md bg-slate-100 px-3.5 py-2 text-sm leading-relaxed text-slate-800 break-words">${richText(m.text)}</div>
    <span class="mt-1 block text-[11px] text-slate-400 tabular">${m.time}</span>
  </div></div>`;
}

function renderMessages() {
  const el = $('#chatMessages');
  const { messages, typing } = state.chat;
  if (!messages.length && !typing) {
    el.innerHTML = `<div class="h-full flex flex-col justify-center fade-in">
      <div class="text-center mb-6">
        <div class="mx-auto w-11 h-11 rounded-full bg-primary-50 text-primary grid place-items-center"><i data-lucide="message-circle-question" class="w-5 h-5"></i></div>
        <p class="mt-3 text-sm font-semibold">Como posso ajudar?</p>
        <p class="mt-1 text-xs text-slate-500 max-w-[260px] mx-auto">Tire dúvidas sobre a situação, o prazo ou o atraso de um pedido.</p>
      </div>
      <div class="space-y-2">
        ${SUGGESTIONS.map((s) => `<button type="button" data-suggest="${s}" class="group w-full flex items-center justify-between gap-3 rounded-lg border border-slate-200 px-3.5 py-2.5 text-left text-sm text-slate-700 hover:border-primary-200 hover:bg-primary-50/60 hover:text-primary transition">
          ${s}<i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-300 group-hover:text-primary"></i></button>`).join('')}
      </div>
    </div>`;
  } else {
    el.innerHTML = `<div class="space-y-4">${messages.map(msgHtml).join('')}${typing
      ? `<div class="flex gap-2.5 items-center fade-in">${avatar}<div class="rounded-2xl rounded-tl-md bg-slate-100 px-3.5 py-2.5 flex items-center gap-2"><span class="typing"><span></span><span></span><span></span></span><span class="text-xs text-slate-500">digitando…</span></div></div>`
      : ''}</div>`;
    el.scrollTop = el.scrollHeight;
  }
  updateSend();
}

function updateSend() {
  $('#chatSend').disabled = state.chat.typing || !$('#chatInput').value.trim();
}

function deliver(msg) {
  state.chat.typing = true;
  renderAll();
  const tok = ++chatToken;
  setTimeout(() => {
    if (tok !== chatToken) return;
    state.chat.typing = false;
    if (!state.connected) {
      msg.status = 'failed';
    } else {
      const text = buildReply(msg.text);
      state.chat.messages.push({ id: ++msgSeq, role: 'assistant', text, time: nowTime() });
    }
    renderAll();
  }, 1100 + Math.random() * 600);
}

function sendMessage(text) {
  text = String(text || '').trim();
  if (!text || state.chat.typing) return;
  const msg = { id: ++msgSeq, role: 'user', text, time: nowTime(), status: 'sent' };
  state.chat.messages.push(msg);
  deliver(msg);
}

function retryMessage(id) {
  if (state.chat.typing) return;
  const i = state.chat.messages.findIndex((m) => m.id === id);
  if (i < 0) return;
  const [msg] = state.chat.messages.splice(i, 1);
  msg.status = 'sent'; msg.time = nowTime();
  state.chat.messages.push(msg);
  deliver(msg);
}

/* =====================================================================
   BARRA DE CONTROLE DO PROTÓTIPO
   ===================================================================== */
const PROTO = [
  { group: 'Rastreio', items: [['t:empty', 'Vazio'], ['t:loading', 'Carregando'], ['t:15', '#15'], ['t:375', '#375'], ['t:562', '#562'], ['t:1002', '#1002'], ['t:notfound', 'Não encontrado'], ['t:error', 'Erro']] },
  { group: 'Chat', items: [['c:empty', 'Vazio'], ['c:conversation', 'Conversa'], ['c:typing', 'Digitando'], ['c:error', 'Erro']] },
  { group: 'Conexão', items: [['n:on', 'Conectado'], ['n:off', 'Sem conexão']] }
];

function activeKeys() {
  const t = state.tracker;
  const tk = t.view === 'result' ? `t:${t.orderId}` : `t:${t.view}`;
  const c = state.chat;
  const ck = c.typing ? 'c:typing' : c.messages.some((m) => m.status === 'failed') ? 'c:error' : c.messages.length ? 'c:conversation' : 'c:empty';
  return [tk, ck, state.connected ? 'n:on' : 'n:off'];
}

function renderProto() {
  const on = activeKeys();
  $('#protoGroups').innerHTML = PROTO.map((g) => `
    <div class="h-4 w-px bg-slate-700"></div>
    <div class="flex items-center gap-0.5">
      <span class="mr-1.5 text-slate-500">${g.group}</span>
      ${g.items.map(([k, l]) => `<button type="button" data-proto="${k}" class="px-2 h-6 rounded font-medium transition ${on.includes(k)
        ? 'bg-white/15 text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}">${l}</button>`).join('')}
    </div>`).join('');
}

function ensureOrderForChat() {
  if (!currentOrder()) openOrderNow(375);
}

function presetConversation(withSecondAnswer) {
  const o = currentOrder();
  const q1 = 'Quando meu pedido chega?', q2 = 'Por que meu pedido atrasou?';
  const msgs = [
    { id: ++msgSeq, role: 'user', text: q1, time: nowTime(4), status: 'sent' },
    { id: ++msgSeq, role: 'assistant', text: whenReply(o), time: nowTime(4) }
  ];
  if (withSecondAnswer) {
    msgs.push({ id: ++msgSeq, role: 'user', text: q2, time: nowTime(2), status: 'sent' });
    msgs.push({ id: ++msgSeq, role: 'assistant', text: whyReply(o), time: nowTime(2) });
  }
  return msgs;
}

function applyPreset(key) {
  const [kind, val] = key.split(':');
  if (kind === 't') {
    trackToken++;
    $('#searchHint').classList.add('hidden');
    if (/^\d+$/.test(val)) { openOrderNow(Number(val)); state.connected = true; }
    else if (val === 'empty') { state.tracker = { view: 'empty', orderId: null, query: '' }; $('#orderInput').value = ''; }
    else if (val === 'loading') { state.tracker = { view: 'loading', orderId: null, query: $('#orderInput').value || '375' }; $('#orderInput').value = state.tracker.query; }
    else if (val === 'notfound') { state.tracker = { view: 'notfound', orderId: null, query: '9999' }; $('#orderInput').value = '9999'; }
    else if (val === 'error') { state.tracker = { view: 'error', orderId: null, query: $('#orderInput').value || '375' }; state.connected = false; }
  } else if (kind === 'c') {
    chatToken++;
    state.chat.typing = false;
    if (val === 'empty') state.chat.messages = [];
    else {
      ensureOrderForChat();
      if (val === 'conversation') state.chat.messages = presetConversation(true);
      else if (val === 'typing') {
        state.chat.messages = presetConversation(false);
        state.chat.messages.push({ id: ++msgSeq, role: 'user', text: 'Por que meu pedido atrasou?', time: nowTime(), status: 'sent' });
        state.chat.typing = true; // fica parado para inspeção
      } else if (val === 'error') {
        state.chat.messages = presetConversation(false);
        state.chat.messages.push({ id: ++msgSeq, role: 'user', text: 'Por que meu pedido atrasou?', time: nowTime(), status: 'failed' });
      }
    }
  } else if (kind === 'n') {
    state.connected = val === 'on';
  }
  renderAll();
}

/* =====================================================================
   RENDER GERAL + EVENTOS
   ===================================================================== */
function renderAll() {
  renderConn();
  renderTracker();
  renderChatContext();
  renderMessages();
  renderProto();
  icons();
}

$('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); track($('#orderInput').value); });
$('#orderInput').addEventListener('input', (e) => {
  const clean = e.target.value.replace(/\D/g, '');
  if (clean !== e.target.value) e.target.value = clean;
  if (clean) $('#searchHint').classList.add('hidden');
});

const chatInput = $('#chatInput');
function autosize() { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 128) + 'px'; }
chatInput.addEventListener('input', () => { autosize(); updateSend(); });
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#chatForm').requestSubmit(); }
});
$('#chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.chat.typing || !chatInput.value.trim()) return;
  const text = chatInput.value;
  chatInput.value = ''; autosize();
  sendMessage(text);
});
$('#newChat').addEventListener('click', () => {
  chatToken++;
  state.chat = { messages: [], typing: false };
  renderAll();
  chatInput.focus();
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-example],[data-ask],[data-suggest],[data-retry],[data-proto],#retryTrack');
  if (!t) return;
  if (t.dataset.example) track(t.dataset.example);
  else if (t.dataset.ask) sendMessage(t.dataset.ask);
  else if (t.dataset.suggest) sendMessage(t.dataset.suggest);
  else if (t.dataset.retry) retryMessage(Number(t.dataset.retry));
  else if (t.dataset.proto) applyPreset(t.dataset.proto);
  else if (t.id === 'retryTrack') { state.connected = true; track(state.tracker.query || $('#orderInput').value || '375'); }
});

$('#protoHide').addEventListener('click', () => { $('#protoBar').classList.add('hidden'); $('#protoShow').classList.remove('hidden'); $('#protoShow').classList.add('flex'); });
$('#protoShow').addEventListener('click', () => { $('#protoBar').classList.remove('hidden'); $('#protoShow').classList.add('hidden'); $('#protoShow').classList.remove('flex'); });

/* Presets por URL (para prints): ?t=375&c=conversation&n=on&bar=off
   t = empty|loading|notfound|error|<número>; c = empty|conversation|typing|error; n = on|off
   bar=off oculta a barra e o botão flutuante (print limpo) */
function applyUrlPresets() {
  const p = new URLSearchParams(location.search);
  ['t', 'c', 'n'].forEach((k) => { if (p.has(k)) applyPreset(`${k}:${p.get(k)}`); });
  if (p.get('bar') === 'off') { $('#protoBar').classList.add('hidden'); $('#protoShow').remove(); }
}

renderAll();
applyUrlPresets();
</script>
</body>
